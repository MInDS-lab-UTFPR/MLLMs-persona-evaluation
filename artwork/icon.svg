<?xml version="1.0" encoding="UTF-8"?>
<!--
  Editable source for the site icon (app/icon.png).

  The mark is the study in one shape: fifty agents share a persona and land on
  the same judgement, so a ring of small marks resolves into a single centre.
  It is deliberately not a letter, so it cannot be mistaken for the sibling
  project page's serif "P".

  Render the committed PNG from this directory with:

    rsvg-convert -w 512 -h 512 -o ../app/icon.png icon.svg
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512"
     role="img" aria-label="Six agent marks converging on a single centre">
  <circle cx="256" cy="256" r="246" fill="#126844" />

  <!-- Six agents on a hexagonal ring, each tethered to the centre. -->
  <g stroke="#3f9a6d" stroke-width="10" stroke-linecap="round">
    <line x1="256" y1="256" x2="256.0" y2="101.0" />
    <line x1="256" y1="256" x2="390.2" y2="178.5" />
    <line x1="256" y1="256" x2="390.2" y2="333.5" />
    <line x1="256" y1="256" x2="256.0" y2="411.0" />
    <line x1="256" y1="256" x2="121.8" y2="333.5" />
    <line x1="256" y1="256" x2="121.8" y2="178.5" />
  </g>
  <g fill="#fd9b86">
    <circle cx="256.0" cy="101.0" r="30" />
    <circle cx="390.2" cy="178.5" r="30" />
    <circle cx="390.2" cy="333.5" r="30" />
    <circle cx="256.0" cy="411.0" r="30" />
    <circle cx="121.8" cy="333.5" r="30" />
    <circle cx="121.8" cy="178.5" r="30" />
  </g>

  <!-- The shared judgement they converge on. -->
  <circle cx="256" cy="256" r="76" fill="#f4603f" />
</svg>
