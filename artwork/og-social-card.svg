<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <title>Social preview for Stable Behavior, Limited Variation</title>
  <desc>The paper's title and headline finding beside a compact redrawing of the three-phase experimental design: 1,200 persona-driven agents, a persona annotation branch with a dashed no-persona ablation, and a convergence and agreement analysis.</desc>

  <!-- Editable source for public/og.png. Typography is deterministic and the
       diagram is drawn here rather than imported, so the card can be re-rendered
       from this file alone. Sizes are tuned for the 1200x630 crop that Slack,
       LinkedIn, and X show; nothing here is expected to read below half scale. -->

  <rect width="1200" height="630" fill="#ffffff"/>
  <rect x="0" y="0" width="400" height="8" fill="#126844"/>
  <rect x="400" y="0" width="400" height="8" fill="#e0a23c"/>
  <rect x="800" y="0" width="400" height="8" fill="#f4603f"/>

  <g font-family="Avenir Next, Helvetica Neue, Arial, sans-serif">
    <text x="64" y="58" fill="#126844" font-size="14" font-weight="700" letter-spacing="1.9">IEEE DCOSS-IOT-URBCOM 2026  /  ARXIV:2604.28048</text>

    <text x="64" y="133" fill="#172b35" font-family="Georgia, Times New Roman, serif" font-size="45" font-weight="400" letter-spacing="-1.35">
      <tspan x="64" dy="0">Stable Behavior,</tspan>
      <tspan x="64" dy="52">Limited Variation</tspan>
    </text>

    <text x="64" y="243" fill="#41545d" font-size="21" font-weight="500">
      <tspan x="64" dy="0">Persona Validity in LLM Agents</tspan>
      <tspan x="64" dy="30">for Urban Sentiment Perception</tspan>
    </text>

    <line x1="64" y1="330" x2="454" y2="330" stroke="#dfe5e7" stroke-width="1"/>
    <text x="64" y="367" fill="#31464f" font-size="17" font-weight="500">
      Personas make agents stable.
    </text>
    <text x="64" y="394" fill="#126844" font-size="17" font-weight="700">
      They do not make them different.
    </text>

    <text x="64" y="472" fill="#172b35" font-size="13" font-weight="700" letter-spacing="0.15">59,708 ANNOTATIONS</text>
    <circle cx="224" cy="468" r="2.3" fill="#a9b4b8"/>
    <text x="237" y="472" fill="#172b35" font-size="13" font-weight="700" letter-spacing="0.15">1,200 AGENTS</text>
    <text x="64" y="500" fill="#172b35" font-size="13" font-weight="700" letter-spacing="0.15">24 PERSONA PROFILES</text>
    <circle cx="238" cy="496" r="2.3" fill="#a9b4b8"/>
    <text x="251" y="500" fill="#172b35" font-size="13" font-weight="700" letter-spacing="0.15">50 URBAN SCENES</text>

    <text x="64" y="570" fill="#687980" font-size="13" font-weight="600" letter-spacing="1.2">DA SILVA, MINETTO, SILVER, SILVA  ·  2026</text>
  </g>

  <line x1="490" y1="58" x2="490" y2="574" stroke="#e7ebed" stroke-width="1"/>

  <!-- Compact redrawing of figure 1: same palette and same dashed ablation branch. -->
  <defs>
    <marker id="og-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5"
            orient="auto-start-reverse" markerUnits="strokeWidth">
      <path d="M 0 0.8 L 10 5 L 0 9.2 L 2.6 5 Z" fill="#333333"/>
    </marker>
    <marker id="og-arrow-dash" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5"
            orient="auto-start-reverse" markerUnits="strokeWidth">
      <path d="M 0 0.8 L 10 5 L 0 9.2 L 2.6 5 Z" fill="#8c8c8c"/>
    </marker>
  </defs>

  <g font-family="Avenir Next, Helvetica Neue, Arial, sans-serif">
    <text x="540" y="106" fill="#687980" font-size="12" font-weight="700" letter-spacing="1.25">EXPERIMENTAL DESIGN</text>

    <g fill="none" stroke-width="1.8" stroke-linejoin="round">
      <path d="M 690 284 V 200 H 738" stroke="#333333" marker-end="url(#og-arrow)"/>
      <path d="M 690 284 V 368 H 738" stroke="#8c8c8c" stroke-dasharray="6 5" marker-end="url(#og-arrow-dash)"/>
      <path d="M 906 200 H 1058 V 220" stroke="#333333" marker-end="url(#og-arrow)"/>
      <path d="M 906 368 H 1058 V 348" stroke="#8c8c8c" stroke-dasharray="6 5" marker-end="url(#og-arrow-dash)"/>
    </g>

    <rect x="540" y="238" width="150" height="92" rx="11" fill="#feeac9" stroke="#333333" stroke-width="1.8"/>
    <text x="615" y="272" text-anchor="middle" fill="#333333" font-size="15" font-weight="700">
      <tspan x="615" dy="0">1,200 Agents</tspan>
      <tspan x="615" dy="21" font-size="12" font-weight="500">24 profiles × 50</tspan>
      <tspan x="615" dy="18" font-size="12" font-weight="500">full factorial</tspan>
    </text>

    <rect x="744" y="158" width="162" height="84" rx="11" fill="#ffcdc9" stroke="#333333" stroke-width="1.8"/>
    <text x="825" y="189" text-anchor="middle" fill="#333333" font-size="15" font-weight="700">
      <tspan x="825" dy="0">Persona</tspan>
      <tspan x="825" dy="19">Annotation</tspan>
      <tspan x="825" dy="19" font-size="12" font-weight="500">Qwen3-VL:8B</tspan>
    </text>

    <rect x="744" y="326" width="162" height="84" rx="11" fill="#fff8ec" stroke="#737373" stroke-width="1.8" stroke-dasharray="7 5"/>
    <text x="825" y="357" text-anchor="middle" fill="#737373" font-size="15" font-weight="700">
      <tspan x="825" dy="0">No-Persona</tspan>
      <tspan x="825" dy="19">Ablation</tspan>
      <tspan x="825" dy="19" font-size="12" font-weight="500">think=T / think=F</tspan>
    </text>

    <ellipse cx="1058" cy="284" rx="94" ry="60" fill="#fd7979" stroke="#333333" stroke-width="1.8"/>
    <text x="1058" y="277" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="700">
      <tspan x="1058" dy="0">Convergence &amp;</tspan>
      <tspan x="1058" dy="19">Agreement</tspan>
    </text>

    <line x1="540" y1="470" x2="1160" y2="470" stroke="#dfe5e7" stroke-width="1"/>
    <circle cx="552" cy="506" r="5" fill="#126844"/>
    <text x="567" y="512" fill="#31464f" font-size="15" font-weight="600">agents sharing a persona converge</text>
    <circle cx="552" cy="544" r="5" fill="#f4603f"/>
    <text x="567" y="550" fill="#31464f" font-size="15" font-weight="600">but personas barely differentiate</text>
  </g>
</svg>
