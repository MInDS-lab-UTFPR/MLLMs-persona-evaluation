<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <title>Social preview for Stable Behavior, Limited Variation</title>
  <desc>The paper's title and headline finding beside a compact redrawing of the experimental design: 1,200 persona-driven agents, a persona annotation branch with a dashed no-persona ablation, and a convergence analysis.</desc>

  <!-- Editable source for public/og.png. Laid out on the sibling project page's
       grid — same rules, same stat row, same 1200x630 crop — so the two previews
       read as one series. A feed thumbnail is seen at a glance, so the card
       carries only what survives that: the title, the finding in one breath, the
       scale of the study, and the shape of the design. Everything else (venue
       subtitle, authors, model names, per-node captions) lives on the page. -->

  <rect width="1200" height="630" fill="#ffffff"/>
  <rect x="0" y="0" width="400" height="8" fill="#126844"/>
  <rect x="400" y="0" width="400" height="8" fill="#e0a23c"/>
  <rect x="800" y="0" width="400" height="8" fill="#f4603f"/>

  <g font-family="Avenir Next, Helvetica Neue, Arial, sans-serif">
    <text x="64" y="78" fill="#126844" font-size="13.5" font-weight="700" letter-spacing="2.1">IEEE DCOSS-IOT-URBCOM 2026</text>

    <text x="64" y="186" fill="#172b35" font-family="Georgia, Times New Roman, serif" font-size="50" font-weight="400" letter-spacing="-1.35">
      <tspan x="64" dy="0">Stable Behavior,</tspan>
      <tspan x="64" dy="58">Limited Variation</tspan>
    </text>

    <rect x="64" y="336" width="4" height="78" fill="#126844"/>
    <text x="90" y="366" fill="#41545d" font-size="24" font-weight="500">Personas make agents stable.</text>
    <text x="90" y="402" fill="#126844" font-size="24" font-weight="700">They do not make them different.</text>

    <text x="243" y="574" fill="#172b35" font-size="16" font-weight="700" letter-spacing="1.2" text-anchor="middle">59,708 ANNOTATIONS</text>
    <text x="600" y="574" fill="#172b35" font-size="16" font-weight="700" letter-spacing="1.2" text-anchor="middle">1,200 AGENTS</text>
    <text x="957" y="574" fill="#172b35" font-size="16" font-weight="700" letter-spacing="1.2" text-anchor="middle">24 PERSONAS</text>
  </g>

  <line x1="520" y1="64" x2="520" y2="502" stroke="#e7ebed" stroke-width="1"/>
  <line x1="64" y1="530" x2="1136" y2="530" stroke="#dfe5e7" stroke-width="1"/>

  <!-- Compact redrawing of figure 1: same palette, same dashed ablation branch.
       The figure keeps its own labels — they are what makes it a design rather
       than three coloured boxes. What went away is the text around it. -->
  <defs>
    <marker id="og-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5"
            orient="auto-start-reverse" markerUnits="strokeWidth">
      <path d="M 0 0.8 L 10 5 L 0 9.2 L 2.6 5 Z" fill="#333333"/>
    </marker>
    <marker id="og-arrow-dash" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5"
            orient="auto-start-reverse" markerUnits="strokeWidth">
      <path d="M 0 0.8 L 10 5 L 0 9.2 L 2.6 5 Z" fill="#8c8c8c"/>
    </marker>
  </defs>

  <g font-family="Avenir Next, Helvetica Neue, Arial, sans-serif">
    <g fill="none" stroke-width="1.8" stroke-linejoin="round">
      <path d="M 698 303 V 219 H 748" stroke="#333333" marker-end="url(#og-arrow)"/>
      <path d="M 698 303 V 387 H 748" stroke="#8c8c8c" stroke-dasharray="6 5" marker-end="url(#og-arrow-dash)"/>
      <path d="M 914 219 H 1066 V 239" stroke="#333333" marker-end="url(#og-arrow)"/>
      <path d="M 914 387 H 1066 V 367" stroke="#8c8c8c" stroke-dasharray="6 5" marker-end="url(#og-arrow-dash)"/>
    </g>

    <rect x="548" y="257" width="150" height="92" rx="11" fill="#feeac9" stroke="#333333" stroke-width="1.8"/>
    <text x="623" y="291" text-anchor="middle" fill="#333333" font-size="15" font-weight="700">
      <tspan x="623" dy="0">1,200 Agents</tspan>
      <tspan x="623" dy="21" font-size="12" font-weight="500">24 profiles × 50</tspan>
      <tspan x="623" dy="18" font-size="12" font-weight="500">full factorial</tspan>
    </text>

    <rect x="752" y="177" width="162" height="84" rx="11" fill="#ffcdc9" stroke="#333333" stroke-width="1.8"/>
    <text x="833" y="208" text-anchor="middle" fill="#333333" font-size="15" font-weight="700">
      <tspan x="833" dy="0">Persona</tspan>
      <tspan x="833" dy="19">Annotation</tspan>
      <tspan x="833" dy="19" font-size="12" font-weight="500">Qwen3-VL:8B</tspan>
    </text>

    <rect x="752" y="345" width="162" height="84" rx="11" fill="#fff8ec" stroke="#737373" stroke-width="1.8" stroke-dasharray="7 5"/>
    <text x="833" y="376" text-anchor="middle" fill="#737373" font-size="15" font-weight="700">
      <tspan x="833" dy="0">No-Persona</tspan>
      <tspan x="833" dy="19">Ablation</tspan>
      <tspan x="833" dy="19" font-size="12" font-weight="500">think=T / think=F</tspan>
    </text>

    <ellipse cx="1066" cy="303" rx="94" ry="60" fill="#fd7979" stroke="#333333" stroke-width="1.8"/>
    <text x="1066" y="296" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="700">
      <tspan x="1066" dy="0">Convergence &amp;</tspan>
      <tspan x="1066" dy="19">Agreement</tspan>
    </text>
  </g>
</svg>
