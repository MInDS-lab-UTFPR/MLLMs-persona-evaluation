<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 605" width="1100" height="605"
     role="img" aria-labelledby="design-title design-description">
<title id="design-title">Experimental design in three phases</title>
<desc id="design-description">Phase 1 builds 1,200 persona-driven agents from a balanced full factorial of 24 profiles with 50 agents each. A solid main branch sends them to Phase 2, persona annotation of 50 urban images with Qwen3-VL 8B and thinking enabled. A dashed ablation branch runs the same images with no persona, in thinking-enabled and thinking-disabled variants. Both branches feed Phase 3, a convergence and agreement analysis.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
          orient="auto-start-reverse" markerUnits="strokeWidth">
    <path d="M 0 0.6 L 10 5 L 0 9.4 L 2.4 5 Z" fill="#333333" />
  </marker>
  <marker id="arrow-dash" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
          orient="auto-start-reverse" markerUnits="strokeWidth">
    <path d="M 0 0.6 L 10 5 L 0 9.4 L 2.4 5 Z" fill="#8c8c8c" />
  </marker>
</defs>
<g font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">

  <g font-size="27" font-weight="700" fill="#333333">
    <text x="175" y="40">Phase 1: Persona Design</text>
    <text x="555" y="40">Phase 2: Annotation</text>
    <text x="935" y="40">Phase 3: Evaluation</text>
  </g>

  <path d="M 315 320 V 170 H 379" fill="none" stroke="#333333" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#arrow)" />
  <path d="M 315 320 V 470 H 379" fill="none" stroke="#8c8c8c" stroke-width="2.4" stroke-linejoin="round" stroke-dasharray="9 7" marker-end="url(#arrow-dash)" />
  <path d="M 685 170 H 935 V 254" fill="none" stroke="#333333" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#arrow)" />
  <path d="M 685 470 H 935 V 386" fill="none" stroke="#8c8c8c" stroke-width="2.4" stroke-linejoin="round" stroke-dasharray="9 7" marker-end="url(#arrow-dash)" />

  <rect x="15" y="250" width="300" height="140" rx="17" fill="#feeac9" stroke="#333333" stroke-width="2" />
  <text fill="#333333" font-weight="700">
      <tspan x="165" y="290" font-size="25">1,200 Persona-Driven</tspan>
      <tspan x="165" y="316" font-size="25">Agents</tspan>
      <tspan x="165" y="344" font-size="18" font-weight="400">24 profiles × 50 agents</tspan>
      <tspan x="165" y="368" font-size="18" font-weight="400">Balanced full factorial</tspan>
  </text>

  <rect x="385" y="100" width="300" height="140" rx="17" fill="#ffcdc9" stroke="#333333" stroke-width="2" />
  <text fill="#333333" font-weight="700">
      <tspan x="535" y="140" font-size="25">Persona</tspan>
      <tspan x="535" y="166" font-size="25">Annotation</tspan>
      <tspan x="535" y="194" font-size="18" font-weight="400">Qwen3-VL:8B <tspan font-weight="700">think=T</tspan></tspan>
      <tspan x="535" y="218" font-size="18" font-weight="400">50 urban images</tspan>
  </text>

  <rect x="385" y="400" width="300" height="140" rx="17" fill="#fff8ec" stroke="#737373" stroke-width="2" stroke-dasharray="9 7" />
  <text fill="#737373" font-weight="700">
      <tspan x="535" y="440" font-size="25">No-Persona</tspan>
      <tspan x="535" y="466" font-size="25">Ablation</tspan>
      <tspan x="535" y="494" font-size="18" font-weight="400">Qwen3-VL:8B</tspan>
      <tspan x="535" y="518" font-size="18" font-weight="400">think=T / think=F</tspan>
  </text>

  <ellipse cx="935" cy="320" rx="140" ry="60"
           fill="#fd7979" stroke="#333333" stroke-width="2" />
  <text fill="#ffffff" font-weight="700" font-size="24">
      <tspan x="935" y="298">Convergence &amp;</tspan>
      <tspan x="935" y="324">Agreement</tspan>
      <tspan x="935" y="350">Analysis</tspan>
  </text>

  <g transform="translate(935, 570)">
    <line x1="-152" y1="-6" x2="-96" y2="-6" stroke="#333333" stroke-width="2.4" />
    <text x="-88" y="0" text-anchor="start" font-size="20" fill="#333333">main</text>
    <line x1="8" y1="-6" x2="58" y2="-6" stroke="#8c8c8c" stroke-width="2.4"
          stroke-dasharray="9 7" marker-end="url(#arrow-dash)" />
    <text x="82" y="0" text-anchor="start" font-size="20" fill="#333333">ablation</text>
  </g>
</g>
</svg>
